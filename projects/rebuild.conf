# What projects-rebuild does on each machine when a project's commit changes
# (it arrived through Syncthing, or was made here). One project per line:
#   name   hosts          action   command (run in the project, low priority)
# action build:  run the command — only incremental builds that replace their
#                output safely (cargo, ninja + install(1)).
# action notify: only a notification — Hyprland plugins replace a loaded .so
#                (Hyprland crashes; unload, install, load by hand), and
#                mac-cast is the tablet's way to show the Mac.
# Projects that run straight from the checkout (velum, finder, settings,
# mdview's page files) need nothing.
mdview     m1,tablet  build   cd src-tauri && cargo build --release
foot       m1,tablet  build   bin/foot-install
mac-cast   tablet     notify  make install
hyprswipe  m1,tablet  notify  scripts/install.sh
hyprmc     m1,tablet  notify  scripts/install.sh
