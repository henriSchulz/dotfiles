# Installed to ~/.config/icloud-photos/config.toml by install/90-icloud-photos.sh.
#
# The password is NOT here. pyicloud keeps it in the Secret Service keyring,
# where the app puts it the first time you log in.

[icloud]
username = "henri.schulz.bs@icloud.com"
sync_interval_minutes = 15

[cache]
# Full-res cache ceiling in gigabytes; eviction is LRU down to the ratio below.
full_res_cache_limit_gb = 5.0
eviction_target_ratio = 0.9

[paths]
thumbnail_dir = "~/.cache/icloud-photos/thumbnails"
full_res_dir = "~/.cache/icloud-photos/fullres"
db_path = "~/.local/share/icloud-photos/catalog.sqlite"
