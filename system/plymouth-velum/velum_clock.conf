# install/53-plymouth-velum.sh: the velum-clock hook right after plymouth, before encrypt asks.
# mkinitcpio sources this file more than once, so it inserts the hook only once.
if [[ " ${HOOKS[*]} " != *" velum-clock "* ]]; then
  _velum_hooks=()
  for _velum_hook in "${HOOKS[@]}"; do
    _velum_hooks+=("$_velum_hook")
    [[ $_velum_hook == plymouth ]] && _velum_hooks+=(velum-clock)
  done
  HOOKS=("${_velum_hooks[@]}")
  unset _velum_hooks _velum_hook
fi
