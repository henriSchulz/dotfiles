[General]
# Defaults. velum-greeter-sync writes the live values into /var/lib/velum-greeter/theme.conf.user,
# which theme.conf.user (a link set by install/52-sddm-velum.sh) lays over this file.
background=/var/lib/velum-greeter/background
user=
variant=pearl
dark=true
reduceMotion=false
reduceTransparency=false
message=
