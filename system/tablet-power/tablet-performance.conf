# Acer tablet (i5-6200U, Skylake): smoothness over hardening, Henri's choice
# 2026-10-31. mitigations=off drops the Spectre/Meltdown/MDS work (KPTI, IBRS,
# buffer clearing) that Skylake pays on every syscall and context switch; the
# price is that those side channels are open to code running here, including
# JavaScript in the browser. transparent_hugepage=madvise stops khugepaged and
# direct compaction from stalling ordinary allocations; programs that ask for
# huge pages still get them.
KERNEL_CMDLINE[default]+=" mitigations=off transparent_hugepage=madvise"
