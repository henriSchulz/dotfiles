# Laptop power tunables (powertop, 2026-09-26). Installed by dotfiles
# install/48-power-tunables.sh.
# The NMI watchdog fires a periodic interrupt on every core to detect hard
# lockups; on a laptop that is wake-ups for nothing.
kernel.nmi_watchdog = 0
# Flush dirty pages every 15 s instead of 5 s: fewer disk wake-ups.
vm.dirty_writeback_centisecs = 1500
