[bar]
# The macOS menu bar: translucent over the wallpaper (the compositor blurs
# it via this theme's hyprland.lua), dark text, roomier than Omarchy's default.
background       = "#f5f5f7"
background-alpha = 0.72
text             = "#1d1d1f"
active           = "#ff3b30"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32
