# Cupertino — macOS Light appearance, Omarchy palette contract.
# Colors are Apple's system colors: the "accessible" (higher-contrast) variants
# for normal ANSI slots so code stays readable on a light ground, and the
# standard system colors for the bright slots.

mode = "light"

accent = "#0071e3"
selection = "#b4d5fe"
muted = "#a1a1a6"

background = "#f5f5f7"
dark_background = "#ebebef"
darker_background = "#dededf"
lighter_background = "#e8e8ed"

foreground = "#1d1d1f"
dark_foreground = "#86868b"
light_foreground = "#424245"
bright_foreground = "#000000"

# Focused window wears the Apple blue -> cyan sweep; unfocused is the
# macOS hairline separator, not a second color.
hyprland_active_border = "rgba(0071e3ff) rgba(5ac8faff)"
hyprland_inactive_border = "rgba(d2d2d7cc)"

red = "#d70015"
yellow = "#a05a00"
orange = "#c93400"
green = "#248a3d"
cyan = "#0071a4"
blue = "#0071e3"
magenta = "#8944ab"
brown = "#7f6545"

bright_red = "#ff3b30"
bright_yellow = "#d18b00"
bright_green = "#34c759"
bright_cyan = "#30b0c7"
bright_blue = "#0a84ff"
bright_magenta = "#af52de"
