[lock]
# Login field: idle hairline, blue while typing, red on a bad password.
background       = "#f5f5f7"
background-alpha = 0.72
text             = "#1d1d1f"
placeholder      = "#86868b"
text-error       = "#ff3b30"
border           = "#8e8e93"
border-active    = "#0071e3"
border-error     = "#ff3b30"
border-alpha     = 0.85
selection        = "#0071e3"
selection-alpha  = 0.45
