[bar]
# The macOS menu bar: translucent over the wallpaper (the compositor blurs
# it via this theme's hyprland.lua), light text, roomier than Omarchy's default.
background       = "#1c1c1e"
background-alpha = 0.68
text             = "#f5f5f7"
active           = "#ff453a"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32
