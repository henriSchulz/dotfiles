[launcher]
# Spotlight: a translucent card over a light scrim, with the selected row
# painted solid Apple blue and its text knocked out to white.
background                = "#1c1c1e"
background-alpha          = 0.82
text                      = "#f5f5f7"
border                    = "#ffffff"
border-alpha              = 0.16
scrim                     = "#000000"
scrim-alpha               = 0.45
selected-background       = "#0a84ff"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "#0a84ff"
selected-border-alpha     = 0.0
