[controls]
# Normal: barely-there fill on a hairline, the way an AppKit control sits.
normal-color        = "#f5f5f7"
normal-fill-alpha   = 0.07
normal-border       = "#ffffff"
normal-border-width = 1
normal-border-alpha = 0.14

# Hover-cursor: the fill deepens, the hairline stays put.
hover-cursor-color        = "#f5f5f7"
hover-cursor-fill-alpha   = 0.12
hover-cursor-border       = "#ffffff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.20

# Focus: the macOS blue focus ring, which is the one state Apple lets shout.
focus-color        = "#f5f5f7"
focus-fill-alpha   = 0.12
focus-border       = "#0a84ff"
focus-border-width = 2
focus-border-alpha = 0.55

# Selected: tinted with the accent rather than the foreground.
selected-color        = "#0a84ff"
selected-fill-alpha   = 0.22
selected-border       = "#0a84ff"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.20
selection-fill-alpha = 0.30
