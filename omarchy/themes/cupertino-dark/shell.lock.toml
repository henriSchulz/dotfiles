[lock]
# Login field: idle hairline, blue while typing, red on a bad password.
background       = "#1c1c1e"
background-alpha = 0.72
text             = "#f5f5f7"
placeholder      = "#8e8e93"
text-error       = "#ff453a"
border           = "#636366"
border-active    = "#0a84ff"
border-error     = "#ff453a"
border-alpha     = 0.85
selection        = "#0a84ff"
selection-alpha  = 0.45
