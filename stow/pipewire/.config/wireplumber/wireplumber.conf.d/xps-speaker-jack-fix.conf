## On this laptop (Dell XPS 9310, sof-hda-dsp), the internal speakers and the
## headphone jack are separate ALSA/ACP profiles rather than ports within one
## profile, so WirePlumber's own jack-based routing can't switch between them.
## WirePlumber disables ACP's built-in auto profile/port switching by default;
## re-enable it for just this card so the internal speakers stay active unless
## headphones are actually plugged into the jack.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }
]
