# Run the ONNX build of voxtype instead of the Whisper-only one that
# /usr/bin/voxtype points at. Needed for the Parakeet engine; survives
# package updates and needs no root (unlike `voxtype setup variant`).
# install/45-voxtype.sh links the path below to the build for this CPU
# (voxtype-onnx on aarch64, -avx512 / -avx2 on x86_64).
[Service]
ExecStart=
ExecStart=%h/.local/lib/voxtype/voxtype-onnx daemon
