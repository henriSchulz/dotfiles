# Run the ONNX build of voxtype instead of the Whisper-only one that
# /usr/bin/voxtype points at (aarch64 has one ONNX build, no -avx512
# variant). Needed for the Parakeet engine; survives
# package updates and needs no root (unlike `voxtype setup variant`).
[Service]
ExecStart=
ExecStart=/usr/lib/voxtype/voxtype-onnx daemon
